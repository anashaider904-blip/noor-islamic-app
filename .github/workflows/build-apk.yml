name: Build Noor APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip project
        run: mkdir -p project && unzip -o noor-flutter.zip -d project
      - name: Build APK
        run: |
          cd project
          if [ ! -d android ]; then flutter create . --project-name noor_islamic_app; fi
          python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for perm in ['android.permission.INTERNET', 'android.permission.ACCESS_FINE_LOCATION', 'android.permission.ACCESS_COARSE_LOCATION']:
              if perm not in s:
                  s = s.replace('<application', '<uses-permission android:name="' + perm + '"/>\n    <application', 1)
          p.write_text(s)
          print(p.read_text())
          PYEOF
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
