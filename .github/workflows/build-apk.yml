name: Build Noor APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip project
        run: mkdir -p project && unzip -o noor-flutter.zip -d project
      - name: Build APK
        run: |
          cd project
          if [ ! -d android ]; then flutter create . --project-name noor_islamic_app; fi
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
